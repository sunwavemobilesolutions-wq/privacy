name: Publish website

on:
  push:
    branches: [pages, gh-pages]
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out public pages
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check out release pages
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: sunwavemobilesolutions-wq/whats-new
          ref: main
          ssh-key: ${{ secrets.WHATS_NEW_READ_KEY }}
          persist-credentials: false
          path: release-source

      - name: Stage published files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/site/whats-new"
          cp -- .nojekyll privacy.html terms.html support.html "$RUNNER_TEMP/site/"
          rsync --quiet --relative --files-from=release-source/publish-files.txt \
            --exclude='.*' --no-links release-source/whats-new/ "$RUNNER_TEMP/site/whats-new/"
          test -s "$RUNNER_TEMP/site/whats-new/index.html"
          tar -C "$RUNNER_TEMP/site" -cf "$RUNNER_TEMP/artifact.tar" .

      - name: Upload Pages artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
